<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product | Siri Fashion Boutique</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f3ed;
    color: #222;
}

/* NAVBAR */

.navbar {
    height: 80px;
    background: #111;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;
}

.logo {
    color: white;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #d6ad72;
}

.nav-links {
    display: flex;
    gap: 22px;
}

.nav-links a {
    color: white;
    text-decoration: none;

    font-size: 11px;
    font-weight: bold;

    letter-spacing: 1px;
}

.nav-links a:hover {
    color: #d6ad72;
}

/* PRODUCT SECTION */

.product-section {
    padding: 130px 8% 80px;
}

.product-container {
    max-width: 1150px;
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 60px;
}

/* MAIN IMAGE */

.main-image {
    width: 100%;
    height: 600px;

    background: white;
    overflow: hidden;
}

.main-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* DETAILS */

.category {
    color: #b28750;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 3px;
}

.product-details {
    padding-top: 30px;
}

.product-details h1 {
    font-size: 44px;

    margin: 15px 0;
}

.price {
    color: #b28750;

    font-size: 27px;
    font-weight: bold;

    margin-bottom: 25px;
}

.description {
    color: #666;

    line-height: 1.8;

    margin-bottom: 30px;
}

/* SIZE */

.size-title {
    font-weight: bold;

    margin-bottom: 12px;
}

.sizes {
    display: flex;

    gap: 10px;

    margin-bottom: 30px;
}

.size {
    width: 50px;
    height: 45px;

    background: white;

    border: 1px solid #ccc;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.size:hover,
.size.selected {
    background: #111;
    color: white;
}

/* CART */

.cart-btn {
    width: 100%;

    padding: 17px;

    background: #111;
    color: white;

    border: none;

    cursor: pointer;

    font-weight: bold;

    letter-spacing: 2px;

    transition: 0.3s;
}

.cart-btn:hover {
    background: #d6ad72;
    color: #111;
}

/* RELATED */

.related {
    background: white;

    padding: 80px 8%;
}

.related-title {
    text-align: center;

    margin-bottom: 40px;
}

.related-title p {
    color: #b28750;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 3px;
}

.related-title h2 {
    font-size: 38px;

    margin-top: 10px;
}

.related-grid {
    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 25px;
}

.related-card {
    background: #f8f3ed;

    overflow: hidden;

    cursor: pointer;

    transition: 0.3s;
}

.related-card:hover {
    transform: translateY(-8px);
}

.related-card img {
    width: 100%;

    height: 330px;

    object-fit: cover;
}

.related-info {
    padding: 20px;
}

.related-info h3 {
    font-size: 17px;

    margin-bottom: 8px;
}

.related-price {
    color: #b28750;

    font-weight: bold;
}

/* FOOTER */

footer {
    background: #111;

    color: white;

    text-align: center;

    padding: 35px;
}

footer span {
    color: #d6ad72;
}

/* MOBILE */

@media (max-width: 900px) {

    .product-container {
        grid-template-columns: 1fr;
    }

    .related-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .nav-links {
        gap: 8px;
    }

}

</style>

</head>


<body>


<!-- NAVIGATION -->

<header class="navbar">

<div class="logo">
SIRI <span>FASHION BOUTIQUE</span>
</div>

<nav class="nav-links">

<a href="index.html">HOME</a>

<a href="about.html">ABOUT</a>

<a href="women.html">WOMEN</a>

<a href="men.html">MEN</a>

<a href="kids.html">KIDS</a>

<a href="new-arrivals.html">NEW ARRIVALS</a>

<a href="offers.html">OFFERS</a>

<a href="contact.html">CONTACT</a>

</nav>

</header>


<!-- PRODUCT -->

<section class="product-section">

<div class="product-container">


<div class="main-image">

<img id="mainImage" src="" alt="Product">

</div>


<div class="product-details">

<div class="category" id="category"></div>

<h1 id="productName"></h1>

<div class="price" id="productPrice"></div>

<p class="description" id="productDescription"></p>


<div class="size-title">
SELECT SIZE
</div>


<div class="sizes">

<div class="size" onclick="selectSize(this)">
S
</div>

<div class="size" onclick="selectSize(this)">
M
</div>

<div class="size" onclick="selectSize(this)">
L
</div>

<div class="size" onclick="selectSize(this)">
XL
</div>

</div>


<button class="cart-btn" onclick="addToCart()">
ADD TO CART
</button>

</div>

</div>

</section>


<!-- RELATED PRODUCTS -->

<section class="related">

<div class="related-title">

<p id="relatedCategory">
YOU MAY ALSO LIKE
</p>

<h2>
More Similar Products
</h2>

</div>


<div
class="related-grid"
id="relatedProducts">
</div>

</section>


<footer>

© 2026 Siri
<span>Fashion Boutique</span>
| All Rights Reserved

</footer>


<script>

/* =========================================

========================================= */

const products = {

/* ---------- NIGHT ---------- */

description:
"Premium silk night dress designed with a graceful and comfortable fit."

},


night4: {

category: "NIGHT DRESSES",

name: "Luxury Night Dress",

price: "₹2,399",

image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=900&q=85",

description:
"Luxury night wear designed for an elegant and comfortable experience."

},

party1: {

saree1: {

saree2: {

"Beautiful designer saree for weddings and special occasions."

},


saree3: {

category: "SAREES",

name: "Traditional Saree",

price: "₹2,999",

description:
"Traditional saree with an elegant and graceful look."

},


saree4: {

category: "SAREES",

name: "Premium Saree",

price: "₹4,299",

image: "https://images.unsplash.com/photo-1610189012906-4c4d9e1f7d52?auto=format&fit=crop&w=900&q=85",

description:
"Premium saree designed for elegant celebrations."

}

};


/* =========================================
   GET PRODUCT FROM URL
========================================= */

const urlParams =
new URLSearchParams(window.location.search);

const productId =
urlParams.get("product");


const currentProduct =
products[productId] || products.floral1;


/* =========================================
   SHOW CURRENT PRODUCT
========================================= */

document.getElementById("mainImage").src =
currentProduct.image;

document.getElementById("productName").innerText =
currentProduct.name;

document.getElementById("productPrice").innerText =
currentProduct.price;

document.getElementById("category").innerText =
currentProduct.category;

document.getElementById("productDescription").innerText =
currentProduct.description;

document.getElementById("relatedCategory").innerText =
"MORE " + currentProduct.category;


/* =========================================
   FIND SAME CATEGORY PRODUCTS
========================================= */

const relatedContainer =
document.getElementById("relatedProducts");


for (let id in products) {

    if (
        products[id].category === currentProduct.category
        &&
        id !== productId
    ) {

        const product =
        products[id];


        const card =
        document.createElement("div");

        card.className =
        "related-card";


        card.onclick = function () {

            window.location.href =
            "product.html?product=" + id;

        };


        card.innerHTML = `

            <img
            src="${product.image}"
            alt="${product.name}">

            <div class="related-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="related-price">
                    ${product.price}
                </div>

            </div>

        `;


        relatedContainer.appendChild(card);

    }

}


/* =========================================
   SIZE
========================================= */

function selectSize(element) {

    document
    .querySelectorAll(".size")
    .forEach(function(size) {

        size.classList.remove("selected");

    });


    element.classList.add("selected");

}


/* =========================================
   CART
========================================= */

function addToCart() {

    const selectedSize =
    document.querySelector(".size.selected");


    if (!selectedSize) {

        alert("Please select a size first!");

        return;

    }


    alert(
        currentProduct.name +
        " added to cart!\nSize: " +
        selectedSize.innerText
    );

}

</script>

</html>
